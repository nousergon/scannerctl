[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "scannerctl"
version = "0.1.0"
description = "Provider-neutral DLP scanning and egress enforcement runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "Nous Ergon"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
scannerctl = "scannerctl.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
