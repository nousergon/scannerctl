name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: test "v$(python -c 'import scannerctl; print(scannerctl.__version__)')" = "$GITHUB_REF_NAME"

  bundles:
    name: bundle (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            expected_arch: x86_64
            upstream: linux_x64
            upstream_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            expected_arch: aarch64
            upstream: linux_arm64
            upstream_sha256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
          # macos-13 was GitHub's last x64 macOS image and has been retired: a
          # job requesting it is not rejected, it QUEUES — the v0.1.0 release
          # sat 15+ minutes with every other bundle green and no error anywhere.
          # macos-15-intel is the x64 successor; a label that does not exist
          # fails fast and loudly, which is the failure mode we want here.
          - runner: macos-15-intel
            platform: darwin-amd64
            expected_arch: x86_64
            upstream: darwin_x64
            upstream_sha256: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
          - runner: macos-15
            platform: darwin-arm64
            expected_arch: arm64
            upstream: darwin_arm64
            upstream_sha256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Build scannerctl executable
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 . && python -m PyInstaller --clean --onefile --paths src --name scannerctl src/scannerctl/__main__.py
      - name: Fetch and verify upstream backend
        env:
          ASSET: gitleaks_8.30.1_${{ matrix.upstream }}.tar.gz
          EXPECTED: ${{ matrix.upstream_sha256 }}
        run: curl -fsSLo "$RUNNER_TEMP/$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$ASSET" && echo "$EXPECTED  $RUNNER_TEMP/$ASSET" | shasum -a 256 -c - && tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP" gitleaks && test "$("$RUNNER_TEMP/gitleaks" version)" = "8.30.1"
      - name: Stage immutable bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          UPSTREAM_SHA256: ${{ matrix.upstream_sha256 }}
        run: >-
          mkdir -p "stage/scannerctl-$PLATFORM/bin" "stage/scannerctl-$PLATFORM/config" "stage/scannerctl-$PLATFORM/provenance" &&
          install -m 0755 dist/scannerctl "stage/scannerctl-$PLATFORM/bin/scannerctl" &&
          install -m 0755 "$RUNNER_TEMP/gitleaks" "stage/scannerctl-$PLATFORM/bin/gitleaks" &&
          install -m 0644 config/baseline.toml "stage/scannerctl-$PLATFORM/config/baseline.toml" &&
          install -m 0644 LICENSE SECURITY.md provenance/UPSTREAM.md provenance/gitleaks-v8.30.1-checksums.txt "stage/scannerctl-$PLATFORM/provenance/" &&
          printf '{"schema_version":"1","version":"%s","platform":"%s","backend":{"name":"gitleaks","version":"8.30.1","upstream_sha256":"%s"},"supported_previous":"%s"}\n'
          "$GITHUB_REF_NAME" "$PLATFORM" "$UPSTREAM_SHA256" "$(tr -d '\n' < release/N_MINUS_ONE)"
          > "stage/scannerctl-$PLATFORM/release-manifest.json"
      - name: Startup canaries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: '"stage/scannerctl-$PLATFORM/bin/scannerctl" self-test --format json'
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: stage/scannerctl-${{ matrix.platform }}
          format: spdx-json
          output-file: stage/scannerctl-${{ matrix.platform }}/sbom.spdx.json
          upload-artifact: false
      - name: Archive and checksum
        run: tar -C stage -czf "scannerctl-${{ matrix.platform }}.tar.gz" "scannerctl-${{ matrix.platform }}" && shasum -a 256 "scannerctl-${{ matrix.platform }}.tar.gz" > "scannerctl-${{ matrix.platform }}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scannerctl-${{ matrix.platform }}
          path: |
            scannerctl-${{ matrix.platform }}.tar.gz
            scannerctl-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: sign attest publish
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
      - name: Sign every bundle and checksum
        run: for artifact in release/*; do cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"; done
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: release/*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release/*

  oci:
    name: publish OCI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/nousergon/scannerctl:${{ github.ref_name }}
            ghcr.io/nousergon/scannerctl:latest
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
      - name: Sign OCI index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nousergon/scannerctl@$DIGEST"
