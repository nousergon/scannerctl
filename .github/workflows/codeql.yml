name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8
        with:
          languages: python
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8
