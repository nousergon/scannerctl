name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest -q
      - if: matrix.python == '3.13'
        run: python -m ruff check .
      - if: matrix.python == '3.13'
        run: git diff --check

  contract:
    name: release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m scannerctl version --format json
      - run: python -m json.tool schemas/scan-result-v1.schema.json
      - run: python -m json.tool schemas/routes-v1.schema.json
      - run: test "$(wc -l < provenance/gitleaks-v8.30.1-checksums.txt)" -eq 4
