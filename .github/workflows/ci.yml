name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest -q
      - if: matrix.python == '3.13'
        run: python -m ruff check .
      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused. Missing RETURN annotations
      # are not a pyright rule, so ruff's ANN rules run over every source file the PR
      # adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        if: matrix.python == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          basedpyright --pythonpath "$(command -v python)"
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'src/*.py' 'scripts/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              python -m ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi
      - if: matrix.python == '3.13'
        run: git diff --check

  contract:
    name: release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m scannerctl version --format json
      - run: python -m json.tool schemas/scan-result-v1.schema.json
      - run: python -m json.tool schemas/routes-v1.schema.json
      - run: test "$(wc -l < provenance/gitleaks-v8.30.1-checksums.txt)" -eq 4

  image:
    name: image build and canary
    runs-on: ubuntu-latest
    # The OCI image was built only by release.yml, on a tag. A change to the
    # Dockerfile — including a Dependabot base-image bump — therefore reached
    # `main` with a green tick that had never built it, and would have failed
    # first at the next release. The blindness is worse than the defects it
    # hides, so the image is built and exercised on every pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: scannerctl:ci

      - name: Version is reported from inside the image
        run: |
          docker run --rm scannerctl:ci version --format json | tee /tmp/version.json
          python3 -c "import json,sys; p=json.load(open('/tmp/version.json')); sys.exit(0 if p['schema_version']=='1' and p['runtime_version'] else 1)"

      - name: Both startup canaries pass against the bundled backend and config
        run: |
          # The real end-to-end check: benign must be clean and the must-detect
          # payload must block, using the gitleaks binary and baseline config
          # baked into the image. A base-image bump that breaks the backend
          # fails here rather than at the next tag.
          docker run --rm scannerctl:ci self-test --format json | tee /tmp/selftest.json
          python3 -c "
          import json
          report = json.load(open('/tmp/selftest.json'))
          assert report['success'] is True, report
          assert report['benign']['verdict'] == 'clean', report['benign']
          assert report['must_detect']['verdict'] == 'block', report['must_detect']
          assert report['must_detect']['rule_ids'], 'block carried no rule evidence'
          print('canary polarity verified:', report['must_detect']['rule_ids'])
          "

      - name: A blocking payload is refused with the block exit code
        run: |
          printf 'SCANNERCTL_MUST_DETECT_0123456789ABCDEF' > /tmp/payload
          set +e
          docker run --rm -v /tmp/payload:/tmp/payload:ro scannerctl:ci scan --input /tmp/payload --format json
          status=$?
          set -e
          test "$status" -eq 10 || { echo "expected exit 10 (block), got $status" >&2; exit 1; }
